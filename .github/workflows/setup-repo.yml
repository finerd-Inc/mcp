name: Setup repo metadata and release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  administration: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set description, homepage, topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /repos/${{ github.repository }} \
            -f description='Finerd MCP server for Gemini CLI - query your finances in natural language' \
            -f homepage='https://finerd.ai'
          gh api -X PUT /repos/${{ github.repository }}/topics \
            -f 'names[]=gemini-cli-extension' \
            -f 'names[]=mcp' \
            -f 'names[]=gemini-cli' \
            -f 'names[]=finerd' \
            -f 'names[]=personal-finance'

      - name: Create release for v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0 --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists, skipping."
          else
            gh release create v0.1.0 \
              --repo ${{ github.repository }} \
              --title "v0.1.0" \
              --notes "Initial release of the Finerd Gemini CLI extension. Connects Gemini to the Finerd MCP server at https://api.finerd.ai/mcp via OAuth (dynamic discovery). No local server, no tokens to copy."
          fi
